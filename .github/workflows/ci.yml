name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
      # Evidence is append-only: a pull request may only add records.
      - if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: nix run . -- validate --root . --since "$BASE" --json
      # Only proven models reach staging: every model whose closure changed
      # must be verified by evidence on its new closure (verify/<model>).
      - if: github.event_name == 'pull_request' && github.base_ref == 'staging'
        run: nix run . -- status --root . --since origin/staging
