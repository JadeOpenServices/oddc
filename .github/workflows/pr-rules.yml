name: pr-rules
# pull_request_target runs this repository's own workflow with a token that
# may edit the pull request and create its verify/<model> branch. It checks
# out the base, never the pull request.
on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/pr-rules.sh
